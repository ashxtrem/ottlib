<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icons/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      try {
        const preference = localStorage.getItem('ottlib-theme-preference');
        const dark = preference === 'light' ? false : preference === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : true;
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#020617' : '#f8fafc');
      } catch { /* Use the dark default. */ }
    </script>
    <title>OttLib</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
