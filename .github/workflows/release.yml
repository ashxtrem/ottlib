name: Release

# Push a tag like v0.2.0 to build the Android APKs and the server bundles, then draft a GitHub release.
# The release is left as a draft: review the notes and assets, then publish it from the GitHub UI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    name: Version from tag
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH[-suffix]" >&2; exit 1
          fi
          echo "name=${tag}" >> "$GITHUB_OUTPUT"
          # Android needs a monotonically increasing integer: 1.2.3 -> 10203.
          echo "code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))" >> "$GITHUB_OUTPUT"

  test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  android:
    name: Android APKs
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "The ANDROID_KEYSTORE_BASE64 secret is not set; refusing to ship debug-signed APKs (see docs/releasing.md)." >&2
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
      - name: Build signed release APKs
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew test :tv:assembleRelease :mobile:assembleRelease -PversionName=${{ needs.version.outputs.name }} -PversionCode=${{ needs.version.outputs.code }} --stacktrace
      - name: Name and verify the APKs
        shell: bash
        run: |
          mkdir out
          cp apps/android/tv/build/outputs/apk/release/tv-release.apk "out/ottlib-tv-${{ needs.version.outputs.name }}.apk"
          cp apps/android/mobile/build/outputs/apk/release/mobile-release.apk "out/ottlib-mobile-${{ needs.version.outputs.name }}.apk"
          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          for apk in out/*.apk; do
            "${apksigner}" verify --print-certs "$apk" | tee -a signing.txt
            if grep -q "Android Debug" signing.txt; then echo "$apk is signed with the debug key" >&2; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  server:
    name: Server (${{ matrix.label }})
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64, os: windows-latest }
          - { label: linux-x64, os: ubuntu-22.04 }
          - { label: linux-arm64, os: ubuntu-22.04-arm }
          - { label: macos-arm64, os: macos-latest }
          - { label: macos-x64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle with Node and ffprobe
        run: node scripts/package-server.mjs --version ${{ needs.version.outputs.name }} --variant full --out release
      - name: Bundle without Node and ffprobe
        run: node scripts/package-server.mjs --version ${{ needs.version.outputs.name }} --variant lite --out release
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.label }}
          path: |
            release/*.zip
            release/*.tar.gz

  publish:
    name: Draft the release
    needs: [android, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum -- * | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: assets/*
